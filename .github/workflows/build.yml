name: Build

on:
  push:
    branches: [main]
  pull_request:
  # Vom Release-Workflow aufgerufen. Das Image baut und prüft er dort selbst, bevor er es veröffentlicht.
  workflow_call:
    inputs:
      ohne_image:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pruefung:
    name: Lint, Format und Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Production-Build, damit auch Fehler bei Templates und Budgets auffallen.
      - run: npm run build
      # Nur Laufzeit-Abhängigkeiten; Hinweise unter high sollen nicht jeden PR blockieren.
      - run: npm audit --omit=dev --audit-level=high

  image:
    name: Container-Image
    if: ${{ !inputs.ohne_image }}
    needs: playwright
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Podman, denn nur Podman liest .containerignore.
      - run: npm run image
      # CSP und nginx-Regeln greifen nur im Image, deshalb starten und prüfen. Der Job braucht Podman und
      # läuft deshalb auf dem Runner; die Tests selbst laufen im Playwright-Image wie die E2E-Tests, so
      # installiert auch er keine Systempakete per apt (die hängen manchmal).
      - run: npm run image:pruefen
        env:
          PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      - uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: junit/image.xml
          check_name: Ergebnisse Container-Image
          job_summary: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-image
          path: playwright-report/image/
          retention-days: 14

  unit:
    name: Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Mit Abdeckung (ohne Mindestwert) und JUnit, siehe Konfiguration ci in angular.json.
      - run: npm run test:ci
      - id: abdeckung
        name: Abdeckung zusammenfassen
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const datei = "coverage/Haushaltsbuch-Frontend/coverage-summary.json";
            let text = "Keine Abdeckung gemessen.";
            if (fs.existsSync(datei)) {
              const { total } = JSON.parse(fs.readFileSync(datei, "utf8"));
              const zeile = (name, { pct, covered, total }) => `| ${name} | ${pct.toLocaleString("de-DE")} % | ${covered} / ${total} |`;
              text = [
                "**Abdeckung**",
                "",
                "| | Anteil | Abgedeckt |",
                "|---|---:|---:|",
                zeile("Anweisungen", total.statements),
                zeile("Zweige", total.branches),
                zeile("Funktionen", total.functions),
                zeile("Zeilen", total.lines),
              ].join("\n");
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tabelle<<ENDE\n${text}\nENDE\n`);
          '
      - uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: junit/unit.xml
          check_name: Ergebnisse Unit-Tests
          summary: ${{ steps.abdeckung.outputs.tabelle }}
          job_summary: true
          job_summary_text: ${{ steps.abdeckung.outputs.tabelle }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: abdeckung
          path: coverage/
          retention-days: 14

  # Die Version des Playwright-Images muss genau zu Playwright im Lockfile passen, sonst fehlen ihm die
  # Browser. Sie kommt deshalb von dort, so zieht ein Update durch Dependabot das Image mit.
  playwright:
    name: Playwright-Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: version
        run: echo "version=$(jq -er '.packages["node_modules/playwright-core"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E-Tests (${{ matrix.browser }} ${{ matrix.teil }}/${{ matrix.teile }})
    needs: playwright
    runs-on: ubuntu-latest
    # Browser und Systempakete sind im Image schon installiert.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    permissions:
      contents: read
      checks: write
    timeout-minutes: 15
    # Jeder Job ist ein eigener Runner. Firefox ist am langsamsten, deshalb auf zwei Jobs verteilt.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, teil: 1, teile: 1 }
          - { browser: firefox, teil: 1, teile: 2 }
          - { browser: firefox, teil: 2, teile: 2 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.teil }}/${{ matrix.teile }}
        env:
          # Der Runner setzt HOME auf ein Verzeichnis, das nicht root gehört; damit startet Firefox nicht.
          HOME: /root
      # Je Teil ein eigener Check; Wiederholungen, die bestehen, zählen nicht als Fehlschlag.
      - uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() }}
        with:
          report_paths: junit/e2e.xml
          check_name: Ergebnisse E2E ${{ matrix.browser }} ${{ matrix.teil }}/${{ matrix.teile }}
          check_retries: true
          flaky_summary: true
          job_summary: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.teil }}
          path: playwright-report/
          retention-days: 14

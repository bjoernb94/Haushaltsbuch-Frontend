name: Build

on:
  push:
    branches: [main]
  pull_request:
  # Vom Release-Workflow aufgerufen. Das Image baut und prüft er dort selbst, bevor er es veröffentlicht.
  workflow_call:
    inputs:
      ohne_image:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pruefung:
    name: Lint, Format und Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Production-Build, damit auch Fehler bei Templates und Budgets auffallen.
      - run: npm run build
      # Nur Laufzeit-Abhängigkeiten; Hinweise unter high sollen nicht jeden PR blockieren.
      - run: npm audit --omit=dev --audit-level=high

  image:
    name: Container-Image
    if: ${{ !inputs.ohne_image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Der Download der Systempakete hängt manchmal; dann lieber schnell neu starten.
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 5
      # Podman, denn nur Podman liest .containerignore.
      - run: npm run image
      # CSP und nginx-Regeln greifen nur im Image, deshalb starten und prüfen.
      - run: npm run image:pruefen
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-image
          path: playwright-report/image/
          retention-days: 14

  unit:
    name: Unit-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:ci

  e2e:
    name: E2E-Tests (${{ matrix.browser }} ${{ matrix.teil }}/${{ matrix.teile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Jeder Job ist ein eigener Runner. Firefox ist am langsamsten, deshalb auf zwei Jobs verteilt.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, teil: 1, teile: 1 }
          - { browser: firefox, teil: 1, teile: 2 }
          - { browser: firefox, teil: 2, teile: 2 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Der Download der Systempakete hängt manchmal; dann lieber schnell neu starten.
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 5
      - run: npm run e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.teil }}/${{ matrix.teile }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.teil }}
          path: playwright-report/
          retention-days: 14

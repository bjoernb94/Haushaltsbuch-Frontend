name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruefung:
    name: Lint, Format und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Production-Build, damit auch Fehler bei Templates und Budgets auffallen.
      - run: npm run build
      # Nur Laufzeit-Abhängigkeiten; Hinweise unter high sollen nicht jeden PR blockieren.
      - run: npm audit --omit=dev --audit-level=high

  image:
    name: Container-Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      # Podman, denn nur Podman liest .containerignore.
      - run: npm run image
      # CSP und nginx-Regeln greifen nur im Image, deshalb starten und prüfen.
      - run: npm run image:pruefen
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-image
          path: playwright-report/image/
          retention-days: 14

  unit:
    name: Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:ci

  e2e:
    name: E2E-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

<dialog
  #dialog
  aria-labelledby="verwerfen-titel"
  aria-describedby="verwerfen-text"
  (close)="eingaben.antworten(false)"
>
  <h2 id="verwerfen-titel">Änderungen verwerfen?</h2>
  <p id="verwerfen-text">Deine Eingaben wurden noch nicht gespeichert.</p>
  <div class="aktionen">
    <button class="knopf knopf-sekundaer" type="button" (click)="beantworten(false)">
      Weiter bearbeiten
    </button>
    <button class="knopf knopf-gefahr" type="button" (click)="beantworten(true)">Verwerfen</button>
  </div>
</dialog>

<section aria-label="Meldungen">
  <div class="stapel" aria-live="polite">
    @for (toast of benachrichtigungen.toasts(); track toast.id) {
      <div
        class="toast"
        [class]="toast.art"
        [attr.role]="toast.art === 'fehler' ? 'alert' : 'status'"
        (mouseenter)="benachrichtigungen.anhalten(toast.id)"
        (mouseleave)="benachrichtigungen.fortsetzen(toast.id)"
        (focusin)="benachrichtigungen.anhalten(toast.id)"
        (focusout)="fokusRaus($event, toast.id)"
      >
        <app-meldung-symbol [art]="toast.art" />
        <div class="inhalt">
          <p class="titel">
            <span class="sr-only">{{ artText[toast.art] }}: </span>{{ toast.titel }}
          </p>
          @if (toast.text) {
            <p class="text">{{ toast.text }}</p>
          }
          @if (toast.link; as link) {
            <a
              class="link"
              [routerLink]="link.ziel"
              (click)="benachrichtigungen.schliessen(toast.id)"
              >{{ link.text }}</a
            >
          }
        </div>
        <button
          type="button"
          class="schliessen"
          aria-label="Meldung schließen"
          (click)="benachrichtigungen.schliessen(toast.id)"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12"></path>
            <path d="M18 6L6 18"></path>
          </svg>
        </button>
        @if (toast.dauer) {
          <span class="zeit" aria-hidden="true" [style.animation-duration.ms]="toast.dauer"></span>
        }
      </div>
    }
  </div>
</section>

<div class="box" [class]="art()" [attr.role]="rolle()">
  <svg
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    @switch (art()) {
      @case ('fehler') {
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 7.5v5.5"></path>
        <path d="M12 16.5h.01"></path>
      }
      @case ('warnung') {
        <path
          d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"
        ></path>
        <path d="M12 9v4"></path>
        <path d="M12 17h.01"></path>
      }
      @case ('info') {
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 11v5.5"></path>
        <path d="M12 7.5h.01"></path>
      }
      @default {
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M8 12.5l2.8 2.8L16 10"></path>
      }
    }
  </svg>
  <span>{{ text() }}<ng-content /></span>
</div>
@if (aktionText(); as beschriftung) {
  <button type="button" class="knopf knopf-abbrechen" (click)="aktion.emit()">
    {{ beschriftung }}
  </button>
}

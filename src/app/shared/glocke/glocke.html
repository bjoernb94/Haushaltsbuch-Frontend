<button
  #knopf
  type="button"
  class="glocke"
  aria-controls="meldungscenter"
  [attr.aria-expanded]="offen()"
  [attr.aria-label]="label()"
  (click)="umschalten()"
>
  <svg
    width="22"
    height="22"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
    <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
  </svg>
  @if (ungelesen()) {
    <span class="zaehler" aria-hidden="true">{{ zaehler() }}</span>
  }
</button>

@if (offen()) {
  <app-meldungscenter (schliessen)="schliessen()" (verlassen)="offen.set(false)" />
}

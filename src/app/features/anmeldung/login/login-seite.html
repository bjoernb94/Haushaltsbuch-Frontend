<app-anmelde-rahmen
  ueberschrift="Einnahmen und Ausgaben im Blick."
  text="Melde dich an, um dein Haushaltsbuch zu öffnen."
>
  <form class="formular" [formGroup]="formular" (ngSubmit)="anmelden()" novalidate>
    <div class="kopf">
      <h1>Anmelden</h1>
      <p>Willkommen zurück! Bitte gib deine Zugangsdaten ein.</p>
    </div>

    @if (fehlerHinweis(); as text) {
      <app-hinweis-box [text]="text" />
    } @else if (infoHinweis(); as text) {
      <app-hinweis-box [text]="text" art="info" />
    }

    <div class="feld">
      <label for="login-email">E-Mail-Adresse</label>
      <input
        id="login-email"
        type="email"
        autocomplete="email"
        placeholder="name@beispiel.de"
        formControlName="email"
        [attr.aria-invalid]="!!fehler()"
      />
    </div>

    <div class="feld">
      <label for="login-passwort">Passwort</label>
      <input
        id="login-passwort"
        type="password"
        autocomplete="current-password"
        placeholder="Dein Passwort"
        formControlName="passwort"
        [attr.aria-invalid]="!!fehler()"
      />
    </div>

    <div class="aktionen">
      <button
        class="knopf knopf-primaer"
        type="submit"
        [disabled]="sendet() || systemstatus.gesperrt()"
        [attr.aria-busy]="sendet()"
      >
        {{ sendet() ? 'Anmeldung läuft …' : 'Login' }}
      </button>
      @if (systemstatus.gesperrt()) {
        <button class="knopf knopf-sekundaer" type="button" disabled>Registrieren</button>
      } @else {
        <a class="knopf knopf-sekundaer" routerLink="/registrierung">Registrieren</a>
      }
    </div>
  </form>

  @if (systemstatus.status(); as status) {
    <app-systemstatus-leiste [status]="status" />
  }
</app-anmelde-rahmen>

<main class="rahmen" [class.breit]="breit()">
  <section class="marke">
    <div class="logo">
      <app-logo />
      <span>Haushaltsbuch</span>
    </div>
    <div class="botschaft">
      <h2>{{ ueberschrift() }}</h2>
      <p>{{ text() }}</p>
    </div>
    <p class="copyright">© Björn Bochmann</p>
  </section>

  <section class="inhalt">
    <ng-content />
    <footer class="fuss">
      <app-rechtliche-links />
      <app-version-anzeige />
    </footer>
    <p class="copyright-mobil">© Björn Bochmann</p>
  </section>
</main>

<fieldset>
  <legend>Preise</legend>
  <app-vertrag-preisliste
    [betrag]="werte().betrag"
    [beginn]="werte().beginn"
    (betragGeaendert)="betragGeaendert.emit($event)"
    [zeilen]="preise()"
    [werte]="werte().preise"
    [geladen]="geladen()"
    [waehrung]="waehrung()"
    [vorschau]="vorschau()?.preise ?? []"
    [fehler]="fehler()"
    [idPrefix]="idPrefix()"
    (hinzufuegen)="hinzufuegen.emit()"
    (entfernen)="entfernen.emit($event)"
    (geaendert)="geaendert.emit($event)"
  />
</fieldset>
<fieldset>
  <legend>Künftige Erhöhungen</legend>
  <app-vertrag-preissteigerung
    [idPrefix]="idPrefix()"
    [fehler]="fehler()"
    [waehrung]="waehrung()"
    [steigt]="werte().steigt"
    [art]="werte().steigerungsart"
    [prognose]="prognose()"
    [terminVorschlag]="terminVorschlag()"
    [regelGeaendert]="regelGeaendert()"
    (vorschlagUebernehmen)="vorschlagUebernehmen.emit($event)"
  />
</fieldset>

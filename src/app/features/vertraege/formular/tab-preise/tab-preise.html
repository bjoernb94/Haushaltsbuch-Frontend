<fieldset>
  <legend>Preisentwicklung</legend>
  <app-vertrag-preisliste
    [betrag]="werte().betrag"
    [beginn]="werte().beginn"
    (betragGeaendert)="betragGeaendert.emit($event)"
    [zeilen]="preise()"
    [waehrung]="waehrung()"
    [verlauf]="verlauf()"
    [fehler]="fehler()"
    [idPrefix]="idPrefix()"
    (hinzufuegen)="hinzufuegen.emit()"
    (entfernen)="entfernen.emit($event)"
    (geaendert)="geaendert.emit($event)"
  />
  <app-vertrag-preissteigerung
    [idPrefix]="idPrefix()"
    [fehler]="fehler()"
    [waehrung]="waehrung()"
    [waehrungName]="waehrungName()"
    [steigt]="werte().steigt"
    [art]="werte().steigerungsart"
    [prognose]="prognose()"
    [erinnerung]="erinnerung()"
  />
</fieldset>

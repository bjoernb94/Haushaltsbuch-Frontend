<!-- Bis 900 px statt Kopfzeile und Tab-Leiste; die Toasts stehen darunter. -->
<div class="leiste" data-kopf>
  <button type="button" class="leiste-knopf" (click)="zurueck()">Abbrechen</button>
  <h1>Neuer Vertrag</h1>
  <button
    type="submit"
    class="leiste-knopf sichern"
    [attr.form]="formularId"
    [disabled]="!kategorien() || sendet()"
    [attr.aria-busy]="sendet()"
  >
    Sichern
  </button>
</div>

<div class="kopf">
  <p>Pflichtfelder (*) findest du unter „Allgemein“ und „Kosten“. Alles Weitere ist optional.</p>
</div>

@if (ladefehler()) {
  <app-hinweis-box
    text="Die Kategorien konnten nicht geladen werden."
    aktionText="Erneut versuchen"
    (aktion)="laden()"
  />
} @else if (kategorien(); as liste) {
  <app-vertrag-formular
    [kategorien]="liste"
    [sendet]="sendet()"
    [fehlerAntwort]="speicherfehler()"
    [formularId]="formularId"
    knoepfe="ab-901"
    [zusammenfassung]="true"
    (speichern)="speichern($event)"
    (abbrechen)="zurueck()"
  />
} @else {
  <p class="laedt" role="status">Wird geladen …</p>
}

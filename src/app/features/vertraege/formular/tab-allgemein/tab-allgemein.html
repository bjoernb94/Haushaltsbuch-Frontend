<fieldset>
  <legend>Vertrag</legend>
  <div class="raster">
    <div class="feld">
      <label [for]="id('anbieter')">Anbieter *</label>
      <input
        [id]="id('anbieter')"
        type="text"
        placeholder="z. B. Musterversicherung AG"
        formControlName="anbieter"
        [attr.aria-invalid]="!!fehlerText('anbieter')"
        [attr.aria-describedby]="beschreibung('anbieter')"
      />
      @if (fehlerText('anbieter'); as text) {
        <p class="feldfehler" [id]="id('anbieter') + '-fehler'">{{ text }}</p>
      }
    </div>
    <div class="feld">
      <label [for]="id('bezeichnung')">Bezeichnung <span class="optional">(optional)</span></label>
      <input
        [id]="id('bezeichnung')"
        type="text"
        placeholder="Leer = Name des Anbieters"
        formControlName="bezeichnung"
        [attr.aria-invalid]="!!fehlerText('bezeichnung')"
        [attr.aria-describedby]="beschreibung('bezeichnung')"
      />
      @if (fehlerText('bezeichnung'); as text) {
        <p class="feldfehler" [id]="id('bezeichnung') + '-fehler'">{{ text }}</p>
      }
    </div>
    <div class="feld">
      <label [for]="id('kategorieId')">Kategorie *</label>
      <select
        [id]="id('kategorieId')"
        formControlName="kategorieId"
        [attr.aria-invalid]="!!fehlerText('kategorieId')"
        [attr.aria-describedby]="beschreibung('kategorieId')"
      >
        <option value="">Bitte wählen</option>
        @for (kategorie of kategorien(); track kategorie.id) {
          <option [value]="kategorie.id">{{ kategorieText(kategorie) }}</option>
        }
      </select>
      @if (fehlerText('kategorieId'); as text) {
        <p class="feldfehler" [id]="id('kategorieId') + '-fehler'">{{ text }}</p>
      }
    </div>
    <div class="feld">
      <label [for]="id('vertragsnummer')"
        >Vertrags- oder Kundennummer <span class="optional">(optional)</span></label
      >
      <input
        [id]="id('vertragsnummer')"
        type="text"
        placeholder="z. B. KV-123456"
        formControlName="vertragsnummer"
        [attr.aria-invalid]="!!fehlerText('vertragsnummer')"
        [attr.aria-describedby]="beschreibung('vertragsnummer')"
      />
      @if (fehlerText('vertragsnummer'); as text) {
        <p class="feldfehler" [id]="id('vertragsnummer') + '-fehler'">{{ text }}</p>
      }
    </div>
  </div>
</fieldset>

<fieldset>
  <legend>Notiz</legend>
  <div class="feld">
    <label class="sr-only" [for]="id('notiz')">Notiz</label>
    <textarea
      [id]="id('notiz')"
      rows="3"
      placeholder="z. B. Familien-Abo, Preiserhöhung ab 01/2027"
      formControlName="notiz"
      [attr.aria-invalid]="!!fehlerText('notiz')"
      [attr.aria-describedby]="beschreibung('notiz')"
    ></textarea>
    @if (fehlerText('notiz'); as text) {
      <p class="feldfehler" [id]="id('notiz') + '-fehler'">{{ text }}</p>
    }
  </div>
</fieldset>

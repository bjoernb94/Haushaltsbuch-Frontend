<!-- Bis 900 px statt Kopfzeile und Tab-Leiste. -->
<div class="leiste">
  <button type="button" class="leiste-knopf" (click)="zurueck()">Abbrechen</button>
  <h1>Neuer Vertrag</h1>
  <button
    type="submit"
    class="leiste-knopf sichern"
    [attr.form]="formularId"
    [disabled]="!kategorien() || sendet()"
    [attr.aria-busy]="sendet()"
  >
    Sichern
  </button>
</div>

<a class="zurueck" routerLink="/vertraege">
  <svg
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M15 18l-6-6 6-6"></path>
  </svg>
  Zurück zu Verträgen
</a>

<div class="kopf">
  <h1 class="titel">Neuer Vertrag</h1>
  <p>Pflichtfelder (*) findest du unter „Allgemein“ und „Kosten“. Alles Weitere ist optional.</p>
</div>

@if (ladefehler()) {
  <div class="fehler">
    <app-hinweis-box text="Die Kategorien konnten nicht geladen werden." />
    <button type="button" class="knopf knopf-sekundaer" (click)="laden()">Erneut versuchen</button>
  </div>
} @else if (kategorien(); as liste) {
  <app-vertrag-formular
    [kategorien]="liste"
    [sendet]="sendet()"
    [fehlerAntwort]="speicherfehler()"
    [formularId]="formularId"
    knoepfe="ab-901"
    [zusammenfassung]="true"
    (speichern)="speichern($event)"
    (abbrechen)="zurueck()"
  />
} @else {
  <p class="laedt" role="status">Wird geladen …</p>
}

<mat-toolbar class="kopfzeile">
  <button matIconButton (click)="sidenav.toggle()" aria-label="Navigation umschalten">
    <mat-icon>menu</mat-icon>
  </button>
  <span>Haushaltsbuch</span>
  <span class="abstand"></span>
  @if (nutzer(); as n) {
    <span class="nutzername">{{ n.vorname }} {{ n.name }}</span>
  }
  <button matIconButton (click)="abmelden()" aria-label="Abmelden" matTooltip="Abmelden">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="inhalt">
  <mat-sidenav #sidenav mode="side" opened>
    <mat-nav-list>
      @for (eintrag of navigation; track eintrag.pfad) {
        <a
          mat-list-item
          [routerLink]="eintrag.pfad"
          routerLinkActive
          #rla="routerLinkActive"
          [activated]="rla.isActive"
        >
          <mat-icon matListItemIcon>{{ eintrag.icon }}</mat-icon>
          <span matListItemTitle>{{ eintrag.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main>
      <router-outlet />
    </main>
    <footer class="fusszeile">
      <span>© Björn Bochmann</span>
      @if (systemstatus.status(); as status) {
        <app-systemstatus-leiste [status]="status" />
      }
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>

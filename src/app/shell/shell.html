<div class="seite" [class.mit-navigation]="mitNavigation()">
  <header class="kopfzeile">
    <div class="kopfzeile-innen">
      <div class="logo">
        <svg
          width="30"
          height="30"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"></path>
          <path d="M4 21.5V5.5"></path>
          <path d="M9 8h7"></path>
          <path d="M9 12h5"></path>
        </svg>
        <span>Haushaltsbuch</span>
      </div>
      <button type="button" class="abmelden" (click)="abmelden()">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"></path>
          <path d="M10 16l-4-4 4-4"></path>
          <path d="M6 12h10"></path>
        </svg>
        Abmelden
      </button>
    </div>
  </header>

  <div class="rumpf">
    @if (mitNavigation()) {
      <app-hauptmenue />
    }

    <div class="spalte">
      <main>
        @if (komponentenFehler()) {
          <div class="ladefehler">
            <app-hinweis-box text="Deine Bereiche konnten nicht geladen werden." />
            <button type="button" class="knopf knopf-sekundaer" (click)="komponentenLaden()">
              Erneut versuchen
            </button>
          </div>
        }
        <router-outlet />
      </main>
      <footer class="fusszeile">
        <p class="copyright copyright-fusszeile">© Björn Bochmann</p>
        @if (systemstatus.status(); as status) {
          <app-systemstatus-leiste class="status" [status]="status" />
        }
      </footer>
    </div>
  </div>
</div>

<div
  class="seite"
  [class.mit-navigation]="mitNavigation()"
  [class.eigene-leiste]="aktionen().eigeneLeiste"
>
  <app-kopfzeile [seitenleiste]="mitNavigation()" />

  <div class="rumpf">
    <app-hauptmenue />

    <div class="spalte">
      <main>
        @if (komponentenFehler()) {
          <app-hinweis-box
            class="ladefehler"
            text="Deine Bereiche konnten nicht geladen werden."
            aktionText="Erneut versuchen"
            (aktion)="komponentenLaden()"
          />
        }
        <router-outlet />
      </main>
      <app-fusszeile [mitNavigation]="mitNavigation()" [mitStatus]="false" />
    </div>
  </div>
</div>

<app-verwerfen-dialog />

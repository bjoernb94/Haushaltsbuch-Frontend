<div class="seite" [class.eigene-leiste]="aktionen().eigeneLeiste">
  <app-hauptmenue />
  <app-kopfzeile variante="app" />

  <main>
    @if (komponentenFehler()) {
      <app-hinweis-box
        class="ladefehler"
        text="Deine Bereiche konnten nicht geladen werden."
        aktionText="Erneut versuchen"
        (aktion)="komponentenLaden()"
      />
    }
    <router-outlet />
  </main>

  <app-fusszeile variante="app" />
</div>

<app-verwerfen-dialog />

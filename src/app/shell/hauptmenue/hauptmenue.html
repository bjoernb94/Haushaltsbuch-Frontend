<nav class="seitennavigation" aria-label="Hauptmenü">
  <div class="marke">
    <app-logo />
    <span>Haushaltsbuch</span>
  </div>
  <div class="navliste">
    <ng-container *ngTemplateOutlet="navLink; context: { $implicit: uebersicht }"></ng-container>
    @if (bereiche().length) {
      <span class="abschnitt">Komponenten</span>
    }
    @for (bereich of bereiche(); track bereich.pfad) {
      @if (bereich.inaktiv; as inaktiv) {
        <div class="naveintrag inaktiv">
          <ng-container
            *ngTemplateOutlet="navInhalt; context: { $implicit: bereich, status: inaktiv }"
          ></ng-container>
        </div>
      } @else {
        <ng-container *ngTemplateOutlet="navLink; context: { $implicit: bereich }"></ng-container>
      }
    }
  </div>
  <div class="unten">
    <a
      class="naveintrag navlink"
      [routerLink]="einstellungen"
      [state]="einstellungenState()"
      routerLinkActive
      ariaCurrentWhenActive="page"
    >
      <ng-container
        *ngTemplateOutlet="
          navInhalt;
          context: { $implicit: { label: 'Einstellungen', icon: einstellungenIcon } }
        "
      ></ng-container>
    </a>
  </div>
  <p class="copyright">© Björn Bochmann</p>
</nav>

<ng-template #navLink let-eintrag>
  <a
    class="naveintrag navlink"
    [routerLink]="eintrag.pfad"
    routerLinkActive
    ariaCurrentWhenActive="page"
  >
    <ng-container *ngTemplateOutlet="navInhalt; context: { $implicit: eintrag }"></ng-container>
  </a>
</ng-template>

<ng-template #navInhalt let-eintrag let-status="status">
  <svg
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    @for (pfad of eintrag.icon; track pfad) {
      <path [attr.d]="pfad"></path>
    }
  </svg>
  <span class="navtext">
    @if (eintrag.kurz) {
      <span class="lang">{{ eintrag.label }}</span>
      <span class="kurz">{{ eintrag.kurz }}</span>
    } @else {
      {{ eintrag.label }}
    }
    @if (status) {
      <span class="status">{{ status }}</span>
    }
  </span>
</ng-template>

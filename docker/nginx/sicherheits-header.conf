# Per include in jede location mit eigenem add_header, denn add_header in einer location überschreibt die aus server.
# style-src erlaubt 'unsafe-inline', weil Angular Komponenten-Styles zur Laufzeit als <style> anlegt.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
